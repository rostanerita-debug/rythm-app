<style>
:root{
  --bg:#0A0A0A;--s1:#141414;--s2:#1E1E1E;--s3:#282828;
  --g1:#888;--g2:#555;--g3:#333;
  --w:#FFFFFF;--w2:rgba(255,255,255,.7);--w3:rgba(255,255,255,.35);
  --grn:#1DB954;--grn2:#17a347;--gp:rgba(29,185,84,.12);--gb:rgba(29,185,84,.25);
  --org:#FF9F0A;--op:rgba(255,159,10,.12);
  --red:#FF3B30;--rp:rgba(255,59,48,.12);--rb:rgba(255,59,48,.25);
  --pur:#8B5CF6;--pp:rgba(139,92,246,.12);
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);
  --r:18px;--r2:14px;--r3:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--w)}
#root{height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 90px}
.scr::-webkit-scrollbar{display:none}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(14,14,14,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--b);display:flex;align-items:stretch;z-index:100;padding-bottom:env(safe-area-inset-bottom);height:calc(60px + env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:0;touch-action:manipulation}
.nb .ic{font-size:20px;transition:transform .18s}
.nb .lb{font-size:9px;font-weight:600;color:var(--g1);letter-spacing:.4px;transition:color .18s}
.nb.on .lb{color:var(--grn)}
.nb.on .ic{transform:scale(1.1)}
/* FAB central */
.fab-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.fab{width:52px;height:52px;border-radius:26px;background:var(--grn);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(29,185,84,.15);font-size:24px;color:#fff;font-weight:300;transition:all .18s;touch-action:manipulation;margin-bottom:6px}
.fab:active{transform:scale(.9);background:var(--grn2)}

/* ── CARDS ── */
.card{background:var(--s1);border-radius:var(--r);padding:18px;border:1px solid var(--b);margin-bottom:10px}
.card2{background:var(--s2);border-radius:var(--r2);padding:14px;border:1px solid var(--b)}

/* ── SHEET ── */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sht{background:var(--s1);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:430px;animation:up .22s cubic-bezier(.32,0,.67,0)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:36px;height:4px;background:var(--g3);border-radius:99px;margin:0 auto 18px}

/* ── BUTTONS ── */
.btn-g{width:100%;padding:16px;background:var(--grn);border:none;border-radius:var(--r2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:all .15s;touch-action:manipulation}
.btn-g:active{transform:scale(.97);background:var(--grn2)}
.btn-n{width:100%;padding:15px;background:var(--s2);border:1px solid var(--b);border-radius:var(--r2);color:var(--w);font-size:15px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;touch-action:manipulation}

/* ── INPUT ── */
.inp{background:var(--s2);border:1.5px solid var(--b);border-radius:var(--r2);color:var(--w);font-family:Inter,sans-serif;font-size:15px;padding:13px 14px;width:100%;outline:none;transition:border .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--grn)}
.inp::placeholder{color:var(--g2)}

/* ── PROGRESS ── */
.pt{background:var(--s2);border-radius:99px;overflow:hidden}
.pf{border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── SWIPE ── */
.srow{position:relative;overflow:hidden}
.srow+.srow{border-top:1px solid var(--b)}
.sc{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--s1);transition:transform .22s cubic-bezier(.4,0,.2,1);position:relative;z-index:1;touch-action:pan-y}
.sa{position:absolute;right:0;top:0;bottom:0;display:flex;z-index:0}
.sa button{border:none;padding:0 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;color:#fff}

/* ── CHIPS ── */
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 8px;border-radius:14px;cursor:pointer;border:1.5px solid transparent;min-width:64px;background:var(--s2);touch-action:manipulation;transition:all .15s}
.chip.on{border-color:var(--grn);background:var(--gp)}
.chip .ci{font-size:20px}
.chip .cl{font-size:10px;font-weight:600;color:var(--g1)}
.chip.on .cl{color:var(--grn)}

/* ── MOOD ── */
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:12px;cursor:pointer;border:1.5px solid var(--b);touch-action:manipulation;transition:all .15s}
.mood.on{border-color:var(--grn);background:var(--gp)}
.mood .mi{font-size:22px}
.mood .ml{font-size:9px;font-weight:600;color:var(--g1)}
.mood.on .ml{color:var(--grn)}

/* ── MISC ── */
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--b)}
.row:last-child{border-bottom:none}
.tag{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .25s ease-out}
.lw{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:var(--bg)}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cbg{flex:1;background:var(--s2);border-radius:99px;height:9px;overflow:hidden}
.cf{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1)}
select{-webkit-appearance:none;appearance:none}
</style>
</head>

function defS(){return{sc:"home",mo:now.getMonth(),an:now.getFullYear(),profil:"s1",sal:{s1:17500,s2:24000},charges:{s1:INIT_CH.s1.map(c=>({...c})),s2:INIT_CH.s2.map(c=>({...c}))},ck:{s1:{},s2:{}},dt:{s1:{},s2:{}},dep:[],obj:[{id:1,ico:"✈️",label:"Voyage Bali",cible:10000,ep:3200,c:"#1DB954"},{id:2,ico:"💅",label:"Glow Up",cible:3000,ep:1500,c:"#9B59B6"}]};}

// ── CALCULS ────────────────────────────────────────────────
const gCh=()=>S.charges[S.profil];
const gCk=()=>S.ck[S.profil];
const gDt=()=>S.dt[S.profil];
const gSal=()=>S.sal[S.profil];
const tCh=()=>gCh().reduce((s,c)=>s+Number(c.montant),0);
const pCh=()=>gCh().filter(c=>gCk()[c.id]).reduce((s,c)=>s+Number(c.montant),0);
const mDep=()=>S.dep.filter(d=>d.mo===S.mo&&d.an===S.an);
const tDep=()=>mDep().reduce((s,d)=>s+d.m,0);
const reste=()=>gSal()-pCh()-tDep();
const used=()=>Math.min(100,Math.round(((pCh()+tDep())/gSal())*100));
const fmt=n=>Number(n).toLocaleString("fr-FR")+" dh";
const fs=n=>Number(n).toLocaleString("fr-FR");
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ej=s=>String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");

function status(){
  const p=used();
  if(p<60)return{c:"var(--grn)",label:"✓ Budget OK",bg:"var(--gp)",border:"var(--gb)"};
  if(p<85)return{c:"var(--org)",label:"⚡ Attention",bg:"var(--op)",border:"rgba(255,159,10,.3)"};
  return{c:"var(--red)",label:"⚠ Dépassement",bg:"var(--rp)",border:"var(--rb)"};
}

function smartInsights(){
  const deps=mDep();
  const msgs=[];
  // Catégorie dominante
  const bc=CATS.map(c=>({...c,t:deps.filter(d=>d.cat===c.id).reduce((s,d)=>s+d.m,0)})).filter(c=>c.t>0).sort((a,b)=>b.t-a.t);
  if(bc.length>0&&bc[0].t>gSal()*.15) msgs.push(`Tu dépenses beaucoup en ${bc[0].lbl.toLowerCase()} (${fmt(bc[0].t)}) 👀`);
  // Stress spending
  const stress=deps.filter(d=>d.mood==="stress");
  if(stress.length>=2) msgs.push(`${stress.length} dépenses sous stress — ${fmt(stress.reduce((s,d)=>s+d.m,0))} dh 😤`);
  // Épargne potentielle
  const r=reste();
  if(r>2000) msgs.push(`Tu peux économiser ${fmt(Math.round(r*.5))} de plus ce mois 💎`);
  // Projection
  const today=new Date().getDate();
  const avgD=today>0?tDep()/today:0;
  const proj=avgD*31;
  if(proj>gSal()*.9) msgs.push(`À ce rythme, tu dépasseras ton budget 🔴`);
  if(msgs.length===0) msgs.push("Tu gardes un bon rythme ce mois-ci 🎯");
  return msgs;
}

// ── ANALYSE ────────────────────────────────────────────────
function rAna(){
  const deps=mDep();
  const tot=tDep();
  const bc=CATS.map(c=>({...c,t:deps.filter(d=>d.cat===c.id).reduce((s,d)=>s+d.m,0)})).filter(c=>c.t>0).sort((a,b)=>b.t-a.t);
  const bm=MOODS.map(m=>({...m,t:deps.filter(d=>d.mood===m.id).reduce((s,d)=>s+d.m,0),n:deps.filter(d=>d.mood===m.id).length})).filter(m=>m.t>0);
  const insights=smartInsights();
  // Historique 3 mois
  const hist=[];const seen=new Set();
  S.dep.forEach(d=>{const k=d.an+"-"+d.mo;if(!seen.has(k)){seen.add(k);hist.push({mo:d.mo,an:d.an});}});
  hist.sort((a,b)=>b.an!==a.an?b.an-a.an:b.mo-a.mo);

    <div style="font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:20px">Analyse</div>

      </div>
      <div class="card2">
        <div style="font-size:9px;font-weight:700;color:var(--g1);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">Dépenses libres</div>
        <div style="font-size:20px;font-weight:800;color:var(--red)">${fmt(tot)}</div>
      </div>
    </div>

    <!-- INSIGHTS -->
    ${insights.length>0?`<div style="background:linear-gradient(135deg,rgba(29,185,84,.1),rgba(29,185,84,.03));border:1px solid rgba(29,185,84,.2);border-radius:var(--r2);padding:14px 16px;margin-bottom:10px">
      <div style="font-size:10px;font-weight:700;color:var(--grn);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">🧠 Insights</div>
      ${insights.map(i=>`<div style="font-size:13px;color:rgba(255,255,255,.85);line-height:1.5;margin-bottom:5px;display:flex;gap:8px"><span style="color:var(--grn);flex-shrink:0">→</span>${i}</div>`).join("")}
    </div>`:""}

    <!-- CATÉGORIES -->

      <div style="font-size:14px;font-weight:700;margin-bottom:14px">Par catégorie</div>

          <div style="display:flex;justify-content:space-between;margin-bottom:4px">

    <!-- OBJECTIFS -->
    ${S.obj.length>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

    <!-- HISTORIQUE -->
    ${hist.length>0?`<div class="card" style="margin-bottom:10px">
      <div style="font-size:14px;font-weight:700;margin-bottom:14px">Historique</div>
      ${hist.slice(0,4).map(({mo,an})=>{

function bindPad(){

function updA(){
  const mnt=parseFloat(ND.m)||0;

function valAdd(){

function tCk(id){
  const n={...gCk(),[id]:!gCk()[id]};
  if(!gCk()[id]){const d=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});S.dt[S.profil]={...gDt(),[id]:d};}
  S.ck[S.profil]=n;save();
  if(gCh().every(c=>n[c.id]))toast("Toutes les charges payées 🎉");
  render();
}

// ── SWIPE ──────────────────────────────────────────────────
function swS(e,id){swX0=e.touches[0].clientX;}
function swM(e,id){
  const dx=e.touches[0].clientX-swX0;
  const el=document.getElementById("sc-"+id);if(!el)return;
  if(dx<0){el.style.transition="none";el.style.transform=`translateX(${Math.max(-120,dx)}px)`;}
  else if(swRev.has(id)){el.style.transition="none";el.style.transform=`translateX(${Math.min(0,dx-120)}px)`;}
}
function swE(e,id){
  const dx=e.changedTouches[0].clientX-swX0;
  const el=document.getElementById("sc-"+id);if(!el)return;
  el.style.transition="transform .22s cubic-bezier(.4,0,.2,1)";
  if(dx<-50){el.style.transform="translateX(-120px)";swRev.add(id);swRev.forEach(oid=>{if(oid!==id){const o=document.getElementById("sc-"+oid);if(o){o.style.transform="translateX(0)";swRev.delete(oid);}}});}
  else{el.style.transform="translateX(0)";swRev.delete(id);}
}

// ── EXPORT CSV ─────────────────────────────────────────────
function exportCSV(mo,an){
  const deps=S.dep.filter(d=>d.mo===mo&&d.an===an);
  if(!deps.length){toast("Aucune dépense ce mois");return;}
  let csv="Date,Categorie,Montant,Humeur,Note\n";
  deps.forEach(d=>{
    const cat=CATS.find(c=>c.id===d.cat)?.lbl||"Autre";
    const mood=MOODS.find(m=>m.id===d.mood)?.lbl||"";
    const dt=new Date(d.dt).toLocaleDateString("fr-FR");
    csv+=`${dt},${cat},${d.m},${mood},"${(d.note||"").replace(/"/g,"'")}"\n`;
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`RYTHM_${MF[mo]}_${an}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);toast("CSV téléchargé ✓");
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg){
  const t=document.createElement("div");t.textContent=msg;
  t.style.cssText="position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--grn);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 20px rgba(29,185,84,.4);transition:opacity .3s";
  document.body.appendChild(t);setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),300);},2000);
}

async function dL(){
  const email=document.getElementById("le")?.value?.trim();
  const pwd=document.getElementById("lp")?.value;
  const err=document.getElementById("lerr");
  if(!email||!pwd){if(err){err.style.display="block";err.textContent="Remplis email et mot de passe.";}return;}
  if(err)err.style.display="none";
  const{data,error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){const{data:d2,error:e2}=await sb.auth.signUp({email,password:pwd});if(e2){if(err){err.style.display="block";err.textContent=e2.message;}return;}if(d2.user){CU=d2.user;aL();return;}}
  if(data?.user){CU=data.user;aL();}
}
async function dG(){await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});}
function aL(){document.getElementById("nav").style.display="flex";G("home");}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){CU=session.user;document.getElementById("nav").style.display="flex";G("home");}
  else document.getElementById("app").innerHTML=rLogin();
}

init();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
