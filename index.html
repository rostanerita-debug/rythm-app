<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>RYTHM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#0A0A0A;--s1:#161616;--s2:#1C1C1C;--s3:#222;
  --gris:#888;--gris2:#555;--blanc:#FFF;
  --vert:#1DB954;--vert2:#15A349;--vp:rgba(29,185,84,0.12);
  --orange:#FF9F0A;--op:rgba(255,159,10,0.12);
  --rouge:#FF3B30;--rp:rgba(255,59,48,0.12);
  --violet:#8B5CF6;--viol-p:rgba(139,92,246,0.12);
  --gold:#C9A84C;--gold-p:rgba(201,168,76,0.12);
  --b:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--noir);font-family:Inter,sans-serif;color:var(--blanc);overscroll-behavior:none}
#root{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.scr::-webkit-scrollbar{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,10,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;background:none;border:none;cursor:pointer;transition:all .2s}
.nb .ic{font-size:19px;transition:transform .2s}
.nb .lb{font-size:9px;font-weight:600;color:var(--gris);letter-spacing:.3px;transition:color .2s}
.nb.on .lb{color:var(--vert)}
.nb.on .ic{transform:scale(1.12)}
.fab{position:fixed;bottom:86px;right:18px;width:52px;height:52px;border-radius:26px;background:var(--vert);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(29,185,84,.4);z-index:99;font-size:22px;color:#fff;font-weight:700;transition:all .2s}
.fab:active{transform:scale(.91)}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sht{background:var(--s1);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:430px;animation:up .24s cubic-bezier(.32,0,.67,0)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:32px;height:3px;background:var(--gris2);border-radius:99px;margin:0 auto 18px}
.card{background:var(--s1);border-radius:20px;padding:18px;border:1px solid var(--b);margin-bottom:10px}
.card2{background:var(--s2);border-radius:16px;padding:16px;border:1px solid var(--b)}
.btn1{width:100%;padding:16px;background:var(--vert);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;font-family:Inter,sans-serif}
.btn1:active{transform:scale(.97);background:var(--vert2)}
.btn2{width:100%;padding:15px;background:var(--s2);border:1px solid var(--b);border-radius:14px;color:var(--blanc);font-size:15px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.inp{background:var(--s2);border:1px solid var(--b);border-radius:12px;color:var(--blanc);font-family:Inter,sans-serif;font-size:15px;padding:13px 14px;width:100%;outline:none;transition:border .2s}
.inp:focus{border-color:var(--vert)}
.inp::placeholder{color:var(--gris2)}
.pt{background:var(--s2);border-radius:99px;height:7px;overflow:hidden}
.pf{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.ins{background:linear-gradient(135deg,rgba(29,185,84,.1),rgba(29,185,84,.04));border:1px solid rgba(29,185,84,.2);border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 10px;border-radius:14px;cursor:pointer;transition:all .18s;border:1.5px solid transparent;min-width:66px;background:var(--s2)}
.chip.on{border-color:var(--vert);background:var(--vp)}
.chip .ci{font-size:22px}
.chip .cl{font-size:10px;font-weight:600;color:var(--gris)}
.chip.on .cl{color:var(--vert)}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px;border-radius:14px;cursor:pointer;transition:all .18s;border:1.5px solid var(--b);flex:1}
.mood.on{border-color:var(--vert);background:var(--vp)}
.mood .mi{font-size:24px}
.mood .ml{font-size:10px;font-weight:600;color:var(--gris)}
.mood.on .ml{color:var(--vert)}
.rbc{display:flex;align-items:flex-end;gap:3px;height:56px}
.rc{flex:1;border-radius:4px 4px 0 0;transition:all .5s;min-width:6px}
.ey{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gris)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .28s ease-out forwards}
.lw{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--noir)}
/* CHECKLIST */
.ch-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--b);transition:background .15s}
.ch-row:last-child{border-bottom:none}
.ch-row.done{opacity:.5}
.ck-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--b2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;font-size:13px;font-weight:700;color:#fff}
.ck-btn.on{border:none}
.ck-btn:active{transform:scale(.88)}
.del-btn{font-size:12px;color:rgba(255,59,48,.6);cursor:pointer;background:none;border:none;padding:0 2px;opacity:0;transition:opacity .15s}
.ch-row:hover .del-btn{opacity:1}
.badge{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600}
</style>
</head>
<body>
<div id="root">
  <div id="app" class="scr"></div>
  <nav class="nav" id="nav" style="display:none">
    <button class="nb on" onclick="G('home')" id="nav-home"><span class="ic">◉</span><span class="lb">Home</span></button>
    <button class="nb" onclick="G('check')" id="nav-check"><span class="ic">✓</span><span class="lb">Charges</span></button>
    <button class="nb" onclick="G('dep')" id="nav-dep"><span class="ic">＋</span><span class="lb">Depense</span></button>
    <button class="nb" onclick="G('ana')" id="nav-ana"><span class="ic">◈</span><span class="lb">Analyse</span></button>
    <button class="nb" onclick="G('obj')" id="nav-obj"><span class="ic">◎</span><span class="lb">Objectifs</span></button>
    <button class="nb" onclick="G('ryt')" id="nav-ryt"><span class="ic">⌇</span><span class="lb">Rythme</span></button>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SU="https://kteqrhkoprsnhhyohgih.supabase.co";
const SK="sb_publishable_woOLzRtkihxPLKBhpmLxQA_hfoMUqid";
const sb=supabase.createClient(SU,SK);
let CU=null;

const MF=["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
const now=new Date();

// ── CHARGES INITIALES ──────────────────────────────────────
const INIT_CH={
  s1:[
    {id:1,cat:"EPARGNE",label:"Epargne mensuelle 1",montant:4000,compte:"BOA Epargne",ech:"J1"},
    {id:2,cat:"EPARGNE",label:"Epargne mensuelle 2",montant:1000,compte:"BOA Principal",ech:"J1"},
    {id:3,cat:"FIXES",label:"Credit (mensualite)",montant:2800,compte:"BOA Principal",ech:"J1"},
    {id:4,cat:"FIXES",label:"Aide a maman",montant:3000,compte:"BOA Principal",ech:"J1"},
    {id:5,cat:"FIXES",label:"Abonnement telephone",montant:299,compte:"BOA Principal",ech:"J5"},
    {id:6,cat:"FIXES",label:"Netflix",montant:65,compte:"BOA Principal",ech:"J5"},
    {id:7,cat:"FIXES",label:"Spotify",montant:75,compte:"BOA Principal",ech:"J5"},
    {id:8,cat:"FIXES",label:"Shahid",montant:110,compte:"BOA Principal",ech:"J5"},
    {id:9,cat:"FIXES",label:"iCloud",montant:35,compte:"BOA Principal",ech:"J5"},
    {id:10,cat:"FIXES",label:"Manucure",montant:400,compte:"BOA Principal",ech:"Variable"},
    {id:11,cat:"VARIABLES",label:"Carburant",montant:1200,compte:"CIH Variable",ech:"Variable"},
    {id:12,cat:"VARIABLES",label:"Brushing",montant:250,compte:"CIH Variable",ech:"Variable"},
    {id:13,cat:"VARIABLES",label:"Sorties semaine",montant:2000,compte:"CIH Variable",ech:"Variable"},
  ],
  s2:[
    {id:1,cat:"EPARGNE",label:"Epargne mensuelle 1",montant:4000,compte:"BOA Epargne",ech:"J1"},
    {id:2,cat:"EPARGNE",label:"Epargne mensuelle 2",montant:1000,compte:"BOA Principal",ech:"J1"},
    {id:3,cat:"FIXES",label:"Credit (mensualite)",montant:2800,compte:"BOA Principal",ech:"J1"},
    {id:4,cat:"FIXES",label:"Aide a maman",montant:3000,compte:"BOA Principal",ech:"J1"},
    {id:5,cat:"FIXES",label:"CIMR (retraite)",montant:1500,compte:"BOA Principal",ech:"J1"},
    {id:6,cat:"FIXES",label:"Abonnement telephone",montant:299,compte:"BOA Principal",ech:"J5"},
    {id:7,cat:"FIXES",label:"Netflix",montant:65,compte:"BOA Principal",ech:"J5"},
    {id:8,cat:"FIXES",label:"Spotify",montant:75,compte:"BOA Principal",ech:"J5"},
    {id:9,cat:"FIXES",label:"Shahid",montant:110,compte:"BOA Principal",ech:"J5"},
    {id:10,cat:"FIXES",label:"iCloud",montant:35,compte:"BOA Principal",ech:"J5"},
    {id:11,cat:"FIXES",label:"Manucure",montant:400,compte:"BOA Principal",ech:"Variable"},
    {id:12,cat:"VARIABLES",label:"Carburant",montant:1200,compte:"CIH Variable",ech:"Variable"},
    {id:13,cat:"VARIABLES",label:"Brushing",montant:250,compte:"CIH Variable",ech:"Variable"},
    {id:14,cat:"VARIABLES",label:"Sorties semaine",montant:4000,compte:"CIH Variable",ech:"Variable"},
  ]
};

const CAT_CH={
  EPARGNE:{c:"#1DB954",bg:"rgba(29,185,84,.12)",ic:"💎"},
  FIXES:{c:"#8B5CF6",bg:"rgba(139,92,246,.12)",ic:"🔒"},
  VARIABLES:{c:"#FF9F0A",bg:"rgba(255,159,10,.12)",ic:"💸"},
};

const CATS=[
  {id:"resto",ico:"🍔",lbl:"Resto"},
  {id:"shopping",ico:"🛍",lbl:"Shopping"},
  {id:"transport",ico:"🚗",lbl:"Transport"},
  {id:"factures",ico:"🧾",lbl:"Factures"},
  {id:"sante",ico:"💊",lbl:"Sante"},
  {id:"loisirs",ico:"🎬",lbl:"Loisirs"},
  {id:"beaute",ico:"💅",lbl:"Beaute"},
  {id:"autre",ico:"📦",lbl:"Autre"},
];

const MOODS=[
  {id:"stress",ico:"😤",lbl:"Stress"},
  {id:"plaisir",ico:"😍",lbl:"Plaisir"},
  {id:"fatigue",ico:"😴",lbl:"Fatigue"},
  {id:"neutre",ico:"😐",lbl:"Neutre"},
];

const MSGS=["Tu gardes le rythme ce mois-ci 🎯","Surveille les restos cette semaine 👀","Ton budget est sain. Continue 💚","Rappel: epargner = se payer en premier 💎","Reste concentree — fin de mois proche 🎯"];

function defS(){
  return{
    sc:"home",mois:now.getMonth(),annee:now.getFullYear(),
    profil:"s1",sal:{s1:17500,s2:24000},
    charges:{s1:INIT_CH.s1.map(c=>({...c})),s2:INIT_CH.s2.map(c=>({...c}))},
    checked:{s1:{},s2:{}},dates:{s1:{},s2:{}},
    dep:[],obj:[
      {id:1,ico:"✈️",label:"Voyage Bali",cible:10000,ep:3200,c:"#1DB954"},
      {id:2,ico:"💅",label:"Glow Up",cible:3000,ep:1500,c:"#9B59B6"},
    ],
    filterCat:"TOUT",mi:Math.floor(Math.random()*MSGS.length),
  };
}

function load(){try{const s=localStorage.getItem("rythm_full_v1");if(s)return JSON.parse(s);}catch(e){}return defS();}
function save(){try{localStorage.setItem("rythm_full_v1",JSON.stringify(S));}catch(e){}sync();}
async function sync(){
  if(!CU)return;
  try{await sb.from("budget_data").upsert({
    user_id:CU.id,profil:"rythm_full",mois:S.mois,annee:S.annee,
    charges:{charges:S.charges,checked:S.checked,dates:S.dates,dep:S.dep,obj:S.obj},
    sal:S.sal,updated_at:new Date().toISOString()
  },{onConflict:"user_id,profil,mois,annee"});}catch(e){}
}

let S=load();
let SH=null;
let ND={m:"",cat:"",mood:"",note:""};
let NO={ico:"🎯",label:"",cible:"",ep:"0"};
let EOI=null;
let editMId=null,editMVal="";
let editLId=null,editLVal="";
let nextId=500;

// ── CALCULS ────────────────────────────────────────────────
function gCh(){return S.charges[S.profil];}
function gCk(){return S.checked[S.profil];}
function gDt(){return S.dates[S.profil];}
function gSal(){return S.sal[S.profil];}
function tCh(){return gCh().reduce((s,c)=>s+Number(c.montant),0);}
function pCh(){return gCh().filter(c=>gCk()[c.id]).reduce((s,c)=>s+Number(c.montant),0);}
function tDep(){return S.dep.filter(d=>d.mo===S.mois&&d.an===S.annee).reduce((s,d)=>s+d.m,0);}
function reste(){return gSal()-pCh()-tDep();}
function bPct(){const t=tCh()+tDep();return Math.min(100,Math.round((t/gSal())*100));}
function bSt(){const p=bPct();if(p<50)return{c:"#1DB954",l:"Safe 🟢"};if(p<80)return{c:"#FF9F0A",l:"Attention 🟡"};return{c:"#FF3B30",l:"Danger 🔴"};}
function fmt(n){return Number(n).toLocaleString("fr-FR")+" dh";}
function fs(n){return Number(n).toLocaleString("fr-FR");}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function ej(s){return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");}

function mIns(){const d=S.dep.filter(x=>x.mood==="stress");if(d.length<2)return null;const ca=d.reduce((a,x)=>{a[x.cat]=(a[x.cat]||0)+1;return a;},{});const t=Object.entries(ca).sort((a,b)=>b[1]-a[1])[0];const cl=CATS.find(c=>c.id===t?.[0])?.lbl||"depenses";return d.length>3?"80% de tes "+cl.toLowerCase()+" = quand tu es stressee 😤":null;}
function sMsg(){const m=mIns();if(m)return m;return MSGS[S.mi];}

// ── NAVIGATION ─────────────────────────────────────────────
function G(sc){
  S.sc=sc;
  document.querySelectorAll(".nb").forEach(b=>b.classList.remove("on"));
  const nb=document.getElementById("nav-"+sc);if(nb)nb.classList.add("on");
  SH=null;editMId=null;editLId=null;
  render();
}

function render(){
  const app=document.getElementById("app");
  if(S.sc==="home")app.innerHTML=rHome();
  else if(S.sc==="check")app.innerHTML=rCheck();
  else if(S.sc==="dep")app.innerHTML=rDep();
  else if(S.sc==="ana")app.innerHTML=rAna();
  else if(S.sc==="obj")app.innerHTML=rObj();
  else if(S.sc==="ryt")app.innerHTML=rRyt();
  const ex=document.getElementById("sw");if(ex)ex.remove();
  if(SH==="dep"){const el=document.createElement("div");el.id="sw";el.innerHTML=rSD();document.getElementById("root").appendChild(el);setTimeout(attachPad,0);}
  else if(SH==="obj"){const el=document.createElement("div");el.id="sw";el.innerHTML=rSO();document.getElementById("root").appendChild(el);}
  else if(SH==="addch"){const el=document.createElement("div");el.id="sw";el.innerHTML=rSAC();document.getElementById("root").appendChild(el);}
}

// ── HOME ───────────────────────────────────────────────────
function rHome(){
  const r=reste(),p=bPct(),st=bSt(),msg=sMsg();
  const rc=r<0?"#FF3B30":r<3000?"#FF9F0A":"#FFF";
  const deps=S.dep.filter(d=>d.mo===S.mois&&d.an===S.annee).slice(-3).reverse();
  const chNP=gCh().filter(c=>!gCk()[c.id]).slice(0,3);
  const nbCh=gCh().filter(c=>gCk()[c.id]).length;
  return `<div style="padding:52px 20px 20px" class="fi">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
      <div>
        <div style="font-size:26px;font-weight:900;letter-spacing:-1px">RYTHM</div>
        <div style="font-size:12px;color:var(--gris);margin-top:2px">${MF[S.mois]} ${S.annee} · ${S.profil==="s1"?"Salaire actuel":"Nouveau salaire"}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="background:${S.profil==="s1"?"var(--s2)":"var(--vp)"};border:1px solid ${S.profil==="s1"?"var(--b)":"var(--vert)"};border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;color:${S.profil==="s1"?"var(--gris)":"var(--vert)"}" onclick="S.profil=S.profil==='s1'?'s2':'s1';save();render()">
          ${S.profil==="s1"?"S1 · 17 500":"S2 · 24 000"} dh
        </div>
      </div>
    </div>

    <!-- Carte solde -->
    <div style="background:var(--s1);border-radius:24px;padding:22px;border:1px solid var(--b);margin-bottom:10px">
      <div class="ey" style="margin-bottom:8px">Reste disponible</div>
      <div style="font-size:42px;font-weight:900;letter-spacing:-2px;color:${rc};font-variant-numeric:tabular-nums;margin-bottom:4px">${fmt(r)}</div>
      <div style="font-size:13px;color:var(--gris);margin-bottom:16px">sur ${fmt(gSal())} · ${fmt(pCh())} charges payees · ${fmt(tDep())} depenses</div>
      <div class="pt" style="margin-bottom:8px"><div class="pf" style="width:${p}%;background:${st.c}"></div></div>
      <div style="display:flex;justify-content:space-between">
        <div style="font-size:12px;font-weight:700;color:${st.c}">${st.l}</div>
        <div style="font-size:12px;color:var(--gris)">${p}% du budget utilise</div>
      </div>
    </div>

    <!-- Insight -->
    <div class="ins" style="margin-bottom:10px">
      <span style="font-size:16px">💡</span>
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--vert);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px">RYTHM insight</div>
        <div style="font-size:13px;color:rgba(255,255,255,.85);line-height:1.5">${msg}</div>
      </div>
    </div>

    <!-- Stats grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
      <div class="card" style="margin:0;text-align:center;padding:14px 10px">
        <div class="ey" style="margin-bottom:5px">Charges</div>
        <div style="font-size:18px;font-weight:800;color:var(--violet)">${nbCh}/${gCh().length}</div>
      </div>
      <div class="card" style="margin:0;text-align:center;padding:14px 10px">
        <div class="ey" style="margin-bottom:5px">Depenses</div>
        <div style="font-size:18px;font-weight:800;color:var(--rouge)">${S.dep.filter(d=>d.mo===S.mois&&d.an===S.annee).length}</div>
      </div>
      <div class="card" style="margin:0;text-align:center;padding:14px 10px">
        <div class="ey" style="margin-bottom:5px">Epargne</div>
        <div style="font-size:18px;font-weight:800;color:var(--vert)">${fmt(S.obj.reduce((s,o)=>s+o.ep,0))}</div>
      </div>
    </div>

    <!-- Prochaines charges -->
    ${chNP.length>0?`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:15px;font-weight:700">Charges a venir</div>
      <button onclick="G('check')" style="font-size:12px;font-weight:600;color:var(--vert);background:none;border:none;cursor:pointer">Tout voir →</button>
    </div>
    <div class="card" style="padding:0;margin-bottom:12px">
      ${chNP.map((c,i)=>{const cfg=CAT_CH[c.cat]||{c:"#888",ic:"📦"};return `<div style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:${i<chNP.length-1?"1px solid var(--b)":"none"}">
        <div style="width:8px;height:8px;border-radius:50%;background:${cfg.c};flex-shrink:0"></div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(c.label)}</div><div style="font-size:10px;color:var(--gris);margin-top:1px">${c.ech} · ${c.compte}</div></div>
        <div style="font-size:14px;font-weight:700;color:var(--gris)">${fmt(c.montant)}</div>
      </div>`;}).join("")}
    </div>`:""}

    <!-- Dernieres depenses -->
    ${deps.length>0?`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

}

function savM(id){const v=parseInt(editMVal,10);if(!isNaN(v)&&v>=0)S.charges[S.profil]=S.charges[S.profil].map(c=>c.id===id?{...c,montant:v}:c);editMId=null;save();render();}

// Attacher les events du pavé une seule fois après injection dans le DOM
function attachPad(){
  const btns = document.querySelectorAll("[data-key]");
  btns.forEach(btn => {
    // Utiliser uniquement pointerdown pour éviter le double déclenchement touch+click
    btn.addEventListener("pointerdown", function(e){
      e.preventDefault();
      this.style.opacity = ".6";
      hk(this.dataset.key);
      setTimeout(()=>{ this.style.opacity="1"; }, 100);
    });
  });
}

function hk(k){
  if(k==="⌫") ND.m=ND.m.slice(0,-1)||"";
  else if(k===".") { if(!ND.m.includes(".")) ND.m+="."; }
  else ND.m = ND.m==="0"||ND.m==="" ? String(k) : ND.m+String(k);
  updDepDisplay();
}

function updDepDisplay(){
  const d=document.getElementById("dep-display");
  const btn=document.getElementById("dep-btn");
  if(!d) return;
  const mnt=parseFloat(ND.m)||0;
  const hasAmt = ND.m && ND.m!=="0" && ND.m!=="" && mnt>0;
  d.textContent = mnt>0 ? fs(ND.m)+" dh" : "0 dh";
  d.style.color = hasAmt ? "var(--blanc)" : "var(--gris2)";
  if(btn){ const ok=hasAmt&&ND.cat; btn.style.opacity=ok?"1":".35"; btn.style.pointerEvents=ok?"auto":"none"; }
}

function selCat(id){
  ND.cat = ND.cat===id ? "" : id;
  document.querySelectorAll(".chip").forEach(el=>{ el.classList.remove("on"); });
  if(ND.cat){ const el=document.getElementById("chip-"+id); if(el) el.classList.add("on"); }
  updDepDisplay();
}

function selMood(id){
  ND.mood = ND.mood===id ? "" : id;
  document.querySelectorAll(".mood").forEach(el=>el.classList.remove("on"));
  if(ND.mood){ const el=document.getElementById("mood-"+id); if(el) el.classList.add("on"); }
}

function delDep(id){
  if(!confirm("Supprimer cette depense ?"))return;
  S.dep=S.dep.filter(d=>d.id!==id);
  save();render();
}

function editDep(id){
  const d=S.dep.find(x=>x.id===id);
  if(!d)return;
  const newMnt=prompt("Nouveau montant (dh) :",d.m);
  if(newMnt===null)return;
  const v=parseFloat(newMnt);
  if(isNaN(v)||v<=0){toast("Montant invalide");return;}
  const newNote=prompt("Note (laisser vide pour garder):",d.note||"");
  S.dep=S.dep.map(x=>x.id===id?{...x,m:v,note:newNote!==null?newNote:x.note}:x);
  save();render();toast("Depense modifiee ✓");
}

function vDep(){
  const mnt=parseFloat(ND.m);
  if(!mnt||mnt<=0||!ND.cat)return;
  const note=document.getElementById("dep-note")?.value||"";
  S.dep.push({id:Date.now(),m:mnt,cat:ND.cat,mood:ND.mood,note,dt:new Date().toISOString(),mo:S.mois,an:S.annee});
  ND={m:"",cat:"",mood:"",note:""};
  SH=null;save();render();toast("Depense ajoutee ✓");
}

      <div class="card" style="margin:0;text-align:center"><div class="ey" style="margin-bottom:5px">Depenses</div><div style="font-size:22px;font-weight:800;color:var(--rouge)">${fmt(tDep())}</div></div>
    </div>

    ${mi?`<div class="ins" style="margin-bottom:14px"><span style="font-size:14px">💥</span><div style="font-size:13px;color:rgba(255,255,255,.85);line-height:1.5">${mi}</div></div>`:""}

    ${bc.length>0?`<div class="card" style="margin-bottom:12px">
      <div style="font-size:15px;font-weight:700;margin-bottom:14px">Depenses par categorie</div>
      ${bc.map(c=>`<div style="margin-bottom:13px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <div style="display:flex;align-items:center;gap:7px"><span style="font-size:15px">${c.ico}</span><span style="font-size:13px;font-weight:600">${c.lbl}</span></div>
          <div style="display:flex;gap:7px;align-items:center"><span style="font-size:11px;color:var(--gris)">${c.p}%</span><span style="font-size:13px;font-weight:700">${fmt(c.t)}</span></div>
        </div>
        <div class="pt"><div class="pf" style="width:${c.p}%;background:var(--vert)"></div></div>
      </div>`).join("")}
    </div>`:""}

    ${bm.length>0?`<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:12px">Par humeur</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${bm.map(m=>`<div style="background:var(--s2);border-radius:13px;padding:13px;border:1px solid var(--b)"><div style="font-size:20px;margin-bottom:5px">${m.ico}</div><div style="font-size:11px;font-weight:600;color:var(--gris);margin-bottom:2px">${m.lbl}</div><div style="font-size:15px;font-weight:700">${fmt(m.t)}</div><div style="font-size:10px;color:var(--gris)">${m.n} dep.</div></div>`).join("")}</div></div>`:""}
    `}
  </div>`;
}

// ── OBJECTIFS ──────────────────────────────────────────────
function rObj(){
  return `<div style="padding:52px 20px 20px" class="fi">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
      <div><div class="ey" style="margin-bottom:4px">Motivation</div><div style="font-size:24px;font-weight:800;letter-spacing:-.5px">Objectifs</div></div>
      <button onclick="EOI=null;NO={ico:'🎯',label:'',cible:'',ep:'0'};SH='obj';render()" style="width:40px;height:40px;border-radius:20px;background:var(--vert);border:none;color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center">＋</button>
    </div>
    ${S.obj.length===0?`<div style="text-align:center;padding:50px 0;color:var(--gris)"><div style="font-size:40px;margin-bottom:12px">🎯</div><div style="font-size:15px;font-weight:600">Aucun objectif</div></div>`:`
    ${S.obj.map(o=>{const p=Math.min(100,Math.round((o.ep/o.cible)*100));return `
    <div style="background:var(--s1);border-radius:20px;padding:18px;border:1px solid var(--b);margin-bottom:10px;cursor:pointer" onclick="EOI=${o.id};NO={ico:'${o.ico}',label:'${ej(o.label)}',cible:'${o.cible}',ep:'${o.ep}'};SH='obj';render()">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:28px">${o.ico}</span>
          <div><div style="font-size:15px;font-weight:700">${esc(o.label)}</div><div style="font-size:12px;color:var(--gris);margin-top:1px">Reste ${fmt(o.cible-o.ep)}</div></div>
        </div>
        <div style="font-size:22px;font-weight:900;color:${o.c||"var(--vert)"};">${p}%</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--gris);margin-bottom:8px"><span>${fmt(o.ep)}</span><span>${fmt(o.cible)}</span></div>
      <div style="background:var(--s2);border-radius:99px;height:6px;overflow:hidden"><div style="height:100%;border-radius:99px;background:${o.c||"var(--vert)"};width:${p}%;transition:width 1s"></div></div>
      ${p>=100?`<div style="margin-top:8px;text-align:center;font-size:13px;font-weight:700;color:var(--vert)">🎉 Objectif atteint !</div>`:""}
    </div>`;}).join("")}
    <div class="card" style="text-align:center"><div class="ey" style="margin-bottom:6px">Total epargne</div><div style="font-size:26px;font-weight:800;color:var(--vert)">${fmt(S.obj.reduce((s,o)=>s+o.ep,0))}</div></div>
    `}
  </div>`;
}

function rSO(){
  const ie=EOI!==null;
  const ICOS=["✈️","💅","💼","🏠","🚗","🎓","💊","🎮","📱","🏋️","👜","💍"];
  return `<div class="sov" onclick="if(event.target.classList.contains('sov')){SH=null;render()}">
    <div class="sht" onclick="event.stopPropagation()">
      <div class="hdl"></div>
      <div style="font-size:18px;font-weight:700;margin-bottom:14px">${ie?"Modifier":"Nouvel"} objectif</div>
      <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:13px;padding-bottom:2px;scrollbar-width:none">
        ${ICOS.map(i=>`<button onclick="NO.ico='${i}';render()" style="font-size:22px;padding:8px 10px;border-radius:10px;background:${NO.ico===i?"var(--vp)":"var(--s2)"};border:${NO.ico===i?"1.5px solid var(--vert)":"1px solid var(--b)"};cursor:pointer;flex-shrink:0">${i}</button>`).join("")}
      </div>
      <input class="inp" placeholder="Nom de l'objectif" style="margin-bottom:10px" value="${esc(NO.label)}" oninput="NO.label=this.value">
      <input class="inp" type="number" inputmode="numeric" placeholder="Montant cible (dh)" style="margin-bottom:10px" value="${NO.cible}" oninput="NO.cible=this.value">
      <input class="inp" type="number" inputmode="numeric" placeholder="Deja epargne (dh)" style="margin-bottom:16px" value="${NO.ep}" oninput="NO.ep=this.value">
      <div style="display:flex;gap:8px">
        ${ie?`<button onclick="suppO(${EOI})" style="flex:1;padding:15px;background:var(--rp);border:1px solid var(--rouge);border-radius:14px;color:var(--rouge);font-size:14px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">Supprimer</button>`:""}
        <button class="btn1" onclick="savO()" style="flex:2">${ie?"Enregistrer":"Ajouter"}</button>
      </div>
    </div>
  </div>`;
}

function savO(){const c=parseFloat(NO.cible),e=parseFloat(NO.ep)||0;if(!NO.label.trim()||!c)return;const CLS=["#1DB954","#9B59B6","#FF9F0A","#3498DB","#E74C3C","#1ABC9C"];if(EOI!==null)S.obj=S.obj.map(o=>o.id===EOI?{...o,ico:NO.ico,label:NO.label.trim(),cible:c,ep:e}:o);else S.obj.push({id:Date.now(),ico:NO.ico,label:NO.label.trim(),cible:c,ep:e,c:CLS[S.obj.length%CLS.length]});SH=null;EOI=null;save();render();}
function suppO(id){if(!confirm("Supprimer ?"))return;S.obj=S.obj.filter(o=>o.id!==id);SH=null;EOI=null;save();render();}

// ── RYTHME ─────────────────────────────────────────────────
function rRyt(){
  const deps=S.dep.filter(d=>d.mo===S.mois&&d.an===S.annee);
  const today=new Date().getDate();
  const jours=Array.from({length:today},(_,i)=>i+1);
  const mxD=Math.max(...jours.map(j=>deps.filter(d=>new Date(d.dt).getDate()===j).reduce((s,d)=>s+d.m,0)),1);
  const avgD=deps.length>0?tDep()/today:0;
  const proj=avgD*31;
  const dep=proj>gSal();
  const mi=mIns();
  return `<div style="padding:52px 20px 20px" class="fi">
    <div style="margin-bottom:6px"><div class="ey" style="margin-bottom:4px">Signature RYTHM</div><div style="font-size:24px;font-weight:800;letter-spacing:-.5px">Ton Rythme</div></div>
    <div style="font-size:13px;color:var(--gris);margin-bottom:22px;font-style:italic">Maitrise ton argent. Garde ton rythme.</div>

    <div style="background:${dep?"var(--rp)":"var(--vp)"};border:1px solid ${dep?"var(--rouge)":"var(--vert)"};border-radius:20px;padding:18px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${dep?"var(--rouge)":"var(--vert)"};margin-bottom:6px">Projection fin de mois</div>
      <div style="font-size:28px;font-weight:800;color:${dep?"var(--rouge)":"var(--blanc)"};font-variant-numeric:tabular-nums">${fmt(Math.round(proj))}</div>
      <div style="font-size:13px;color:${dep?"var(--rouge)":"var(--gris)"};margin-top:4px">${dep?"⚠️ Risque de depassement de "+fmt(Math.round(proj-gSal())):"✓ Tu restes dans ton budget"}</div>
    </div>

    ${deps.length>0?`<div class="card" style="margin-bottom:12px">
      <div style="font-size:14px;font-weight:700;margin-bottom:14px">Timeline ${MF[S.mois]}</div>
      <div class="rbc">
        ${jours.map(j=>{const t=deps.filter(d=>new Date(d.dt).getDate()===j).reduce((s,d)=>s+d.m,0);const h=t>0?Math.max(8,Math.round((t/mxD)*50)):4;const we=[0,6].includes(new Date(S.annee,S.mois,j).getDay());const col=t>0?(t>mxD*.7?"#FF3B30":t>mxD*.4?"#FF9F0A":"#1DB954"):"var(--s2)";return `<div class="rc" style="height:${h}px;background:${col};opacity:${we?1:.7}"></div>`;}).join("")}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:5px"><span style="font-size:10px;color:var(--gris)">J1</span><span style="font-size:10px;color:var(--gris)">Aujourd'hui</span></div>
    </div>`:""}

    ${mi?`<div class="ins" style="margin-bottom:12px"><span style="font-size:14px">💥</span><div style="font-size:13px;color:rgba(255,255,255,.85);line-height:1.5">${mi}</div></div>`:""}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="card2" style="text-align:center"><div class="ey" style="margin-bottom:5px">Moy. / jour</div><div style="font-size:17px;font-weight:700">${fmt(Math.round(avgD))}</div></div>
      <div class="card2" style="text-align:center"><div class="ey" style="margin-bottom:5px">Depenses</div><div style="font-size:17px;font-weight:700">${deps.length}</div></div>
      <div class="card2" style="text-align:center"><div class="ey" style="margin-bottom:5px">Charges payees</div><div style="font-size:17px;font-weight:700;color:var(--violet)">${fmt(pCh())}</div></div>
      <div class="card2" style="text-align:center;cursor:pointer" onclick="const v=prompt('Salaire net (dh) :');const n=parseFloat(v);if(!isNaN(n)&&n>0){S.sal[S.profil]=n;save();render();}"><div class="ey" style="margin-bottom:5px">Salaire</div><div style="font-size:15px;font-weight:700;color:var(--vert)">${fmt(gSal())} ✎</div></div>
    </div>
  </div>`;
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg){const t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--vert);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;transition:opacity .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(29,185,84,.4)";document.body.appendChild(t);setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),300);},2000);}

// ── AUTH ───────────────────────────────────────────────────
function rLogin(){
  return `<div class="lw fi">
    <div style="width:100%;max-width:340px">
      <div style="text-align:center;margin-bottom:44px">
        <div style="font-size:10px;letter-spacing:4px;color:var(--vert);font-weight:700;text-transform:uppercase;margin-bottom:14px">Budget app</div>
        <div style="font-size:54px;font-weight:900;letter-spacing:-3px">RYTHM</div>
        <div style="font-size:13px;color:var(--gris);margin-top:8px;font-style:italic">Maitrise ton argent. Garde ton rythme.</div>
      </div>
      <input id="le" class="inp" type="email" inputmode="email" placeholder="Email" style="margin-bottom:10px">
      <input id="lp" class="inp" type="password" placeholder="Mot de passe" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')dL()">
      <div id="lerr" style="display:none;background:var(--rp);border:1px solid var(--rouge);color:var(--rouge);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px"></div>
      <button class="btn1" onclick="dL()" style="margin-bottom:12px">Connexion / Inscription</button>
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0"><div style="flex:1;height:1px;background:var(--b)"></div><div style="font-size:11px;color:var(--gris2)">ou</div><div style="flex:1;height:1px;background:var(--b)"></div></div>
      <button onclick="dG()" style="width:100%;padding:15px;background:var(--s1);border:1px solid var(--b);border-radius:14px;color:var(--blanc);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:Inter,sans-serif">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuer avec Google
      </button>
      <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--gris2)">Donnees privees et securisees 🔒</div>
    </div>
  </div>`;
}

async function dL(){
  const email=document.getElementById("le")?.value?.trim();
  const pwd=document.getElementById("lp")?.value;
  const err=document.getElementById("lerr");
  if(!email||!pwd){if(err){err.style.display="block";err.textContent="Remplis email et mot de passe.";}return;}
  if(err)err.style.display="none";
  const{data,error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){const{data:d2,error:e2}=await sb.auth.signUp({email,password:pwd});if(e2){if(err){err.style.display="block";err.textContent=e2.message;}return;}if(d2.user){CU=d2.user;aL();return;}}
  if(data?.user){CU=data.user;aL();}
}

async function dG(){await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});}
function aL(){document.getElementById("nav").style.display="flex";G("home");}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){CU=session.user;document.getElementById("nav").style.display="flex";G("home");}
  else{document.getElementById("app").innerHTML=rLogin();}
}

init();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
